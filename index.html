<style>
  :root{
    --paper:#FAF8F2; --cream:#FFFFFF; --sand:#F3EDE0; --teal-soft:#E6F1ED;
    --ink:#16302B; --deep:#0E3A34; --deep2:#0A2C28;
    --teal:#1A9C8A; --teal-bright:#23B7A3; --saffron:#DFA425; --saffron-soft:#F7E9C8;
    --line:#E8E1D4; --line-soft:#EFEADF; --muted:#5C6A65;
    --radius:18px; --maxw:1120px;
    --shadow:0 22px 50px -34px rgba(14,58,52,.55);
    --shadow-soft:0 12px 30px -22px rgba(14,58,52,.5);
    --serif:'Fraunces',Georgia,serif; --sans:'Manrope',system-ui,sans-serif; --fa:'Vazirmatn',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  html[dir="rtl"] body{font-family:var(--fa)}
  h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.018em;line-height:1.12;color:var(--ink)}
  html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{font-family:var(--fa);font-weight:700;letter-spacing:0;line-height:1.5}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
  .reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1;transform:none}
  ::selection{background:var(--saffron-soft)}
  :focus-visible{outline:2.5px solid var(--teal);outline-offset:3px;border-radius:6px}

  /* header */
  header{position:sticky;top:0;z-index:40;background:rgba(250,248,242,.78);backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line-soft)}
  .bar{display:flex;align-items:center;gap:18px;height:68px}
  .wordmark{font-weight:800;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
  .wordmark::before{content:"";width:22px;height:22px;border-radius:50%;background:
    radial-gradient(circle at 50% 50%, var(--cream) 0 30%, transparent 31%),
    conic-gradient(var(--teal),var(--teal-bright),var(--teal));box-shadow:0 0 0 2px var(--saffron) inset;flex-shrink:0}
  .wordmark span{font-weight:500;color:var(--teal)}
  html[dir="rtl"] .wordmark span{font-weight:600}
  nav{display:flex;gap:26px;margin-inline-start:auto}
  nav a{font-size:14px;font-weight:600;color:var(--muted);transition:color .2s}
  nav a:hover{color:var(--ink)}
  .bar-right{display:flex;align-items:center;gap:12px;margin-inline-start:18px}
  .btn-mini{font-size:13.5px;font-weight:700;color:#fff;background:var(--deep);padding:9px 16px;border-radius:999px;transition:background .2s,transform .15s}
  .btn-mini:hover{background:var(--teal);transform:translateY(-1px)}
  .lang-toggle{font-family:var(--sans);font-size:13.5px;font-weight:700;color:var(--ink);background:none;border:1px solid var(--line);padding:8px 14px;border-radius:999px;cursor:pointer;transition:border-color .2s,background .2s}
  html[dir="rtl"] .lang-toggle{font-family:var(--fa)}
  .lang-toggle:hover{border-color:var(--teal);background:var(--cream)}
  @media(max-width:840px){nav{display:none}}

  /* hero */
  .hero{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding:clamp(48px,8vw,96px) 0 clamp(40px,6vw,72px)}
  .eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin-bottom:20px}
  html[dir="rtl"] .eyebrow{letter-spacing:.04em}
  .hero h1{font-size:clamp(2.35rem,4.6vw,3.5rem);margin-bottom:22px}
  .hero h1 .em{font-style:italic;color:var(--teal)}
  .lede{font-size:clamp(1.05rem,1.6vw,1.22rem);color:#37463F;max-width:35em;margin-bottom:30px}
  .cta-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .btn{font-family:var(--sans);font-weight:700;font-size:15px;padding:15px 28px;border-radius:999px;cursor:pointer;border:1px solid transparent;transition:transform .15s,background .2s,box-shadow .2s;display:inline-flex;align-items:center;gap:8px}
  html[dir="rtl"] .btn{font-family:var(--fa)}
  .btn-primary{background:var(--teal);color:#04221E;box-shadow:0 14px 28px -16px rgba(26,156,138,.9)}
  .btn-primary:hover{background:var(--teal-bright);transform:translateY(-2px)}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .btn-ghost:hover{border-color:var(--teal);background:var(--cream);transform:translateY(-2px)}
  .hero-trust{margin-top:22px;font-size:13.5px;color:var(--muted);font-weight:600}
  .hero-trust b{color:var(--saffron)}

  /* seal */
  .seal-wrap{display:flex;justify-content:center}
  .seal{position:relative;width:min(330px,80vw);aspect-ratio:1;filter:drop-shadow(var(--shadow));animation:float 7s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .seal svg{width:100%;height:100%;display:block}
  .seal .ring-o{fill:none;stroke:var(--teal);stroke-width:2}
  .seal .ring-i{fill:none;stroke:var(--saffron);stroke-width:1.2;stroke-dasharray:1.5 5;stroke-linecap:round}
  .seal .disc{fill:var(--cream)}
  .seal .arc{fill:var(--teal);font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:3px}
  .seal-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .seal-num{font-family:var(--serif);font-weight:600;font-size:62px;line-height:.9;color:var(--deep);direction:ltr;unicode-bidi:isolate}
  .seal-label{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin-top:8px;line-height:1.35}
  html[dir="rtl"] .seal-label{letter-spacing:0;text-transform:none}
  .seal-stars{color:var(--saffron);font-size:11px;letter-spacing:5px;margin-top:9px}
  @media(max-width:780px){
    .hero{grid-template-columns:1fr;gap:30px}
    .seal-wrap{order:-1}
    .seal{width:min(240px,62vw)}
    .seal-num{font-size:46px}
  }

  /* trust strip */
  .strip{border-block:1px solid var(--line);padding:22px 0;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .strip .cap{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  html[dir="rtl"] .strip .cap{letter-spacing:0;text-transform:none}
  .chips{display:flex;gap:10px;flex-wrap:wrap}
  .chip{font-size:13px;font-weight:700;color:var(--deep);background:var(--teal-soft);border:1px solid #D4E8E2;padding:7px 14px;border-radius:9px}

  /* sections */
  section{padding-block:clamp(60px,8vw,100px)}
  .band{background:var(--sand)}
  .band-deep{background:radial-gradient(120% 140% at 80% 0%, var(--deep) 0%, var(--deep2) 70%)}
  .head{margin-bottom:46px}
  .kicker{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin-bottom:12px}
  html[dir="rtl"] .kicker{letter-spacing:.04em}
  .head h2{font-size:clamp(1.7rem,3vw,2.3rem)}

  /* services */
  .services{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  @media(max-width:820px){.services{grid-template-columns:1fr}}
  .service{background:var(--cream);border:1px solid var(--line);border-radius:var(--radius);padding:30px 28px;transition:transform .25s,box-shadow .25s,border-color .25s}
  .service:hover{transform:translateY(-5px);box-shadow:var(--shadow-soft);border-color:#D7E6E1}
  .ico{width:46px;height:46px;border-radius:13px;background:var(--teal-soft);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
  .ico svg{width:24px;height:24px;fill:none;stroke:var(--teal);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .service h3{font-size:1.2rem;margin-bottom:11px}
  .service p{font-size:14.8px;color:var(--muted)}

  /* process */
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;position:relative}
  @media(max-width:820px){.steps{grid-template-columns:1fr;gap:18px}}
  .step{position:relative;padding-top:8px}
  .step .num{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:var(--cream);border:1.5px solid var(--teal);color:var(--deep);font-family:var(--serif);font-weight:600;font-size:18px;margin-bottom:18px}
  .step h3{font-size:1.18rem;margin-bottom:10px}
  .step p{font-size:14.8px;color:#46554F}
  .band .step p{color:#46554F}

  /* about */
  .about{display:grid;grid-template-columns:1.1fr .9fr;gap:46px;align-items:start}
  @media(max-width:820px){.about{grid-template-columns:1fr;gap:32px}}
  .about p{margin-bottom:18px;color:#37463F;font-size:1.02rem}
  .portrait{width:170px;height:170px;border-radius:20px;object-fit:cover;display:block;margin-bottom:26px;border:1px solid var(--line);box-shadow:0 14px 34px -24px rgba(20,20,20,.55)}
  .sig{margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
  .sig .nm{font-family:var(--serif);font-style:italic;font-weight:500;font-size:1.5rem;color:var(--deep)}
  html[dir="rtl"] .sig .nm{font-family:var(--fa);font-style:normal;font-weight:700}
  .sig .role{font-size:13px;font-weight:600;color:var(--muted);margin-top:3px}
  .cred{background:var(--cream);border:1px solid var(--line);border-radius:var(--radius);padding:12px 24px;box-shadow:var(--shadow-soft)}
  .cred li{list-style:none;padding:15px 0;padding-inline-start:30px;position:relative;font-size:14.6px;font-weight:600;border-bottom:1px solid var(--line-soft)}
  .cred li:last-child{border-bottom:none}
  .cred li::before{content:"";position:absolute;inset-inline-start:0;top:19px;width:16px;height:16px;border-radius:50%;background:var(--teal-soft);
    box-shadow:inset 0 0 0 1.5px var(--teal)}
  .cred li::after{content:"";position:absolute;inset-inline-start:5px;top:23px;width:5px;height:8px;border:solid var(--teal);border-width:0 1.7px 1.7px 0;transform:rotate(45deg)}
  html[dir="rtl"] .cred li::after{inset-inline-start:auto;inset-inline-end:5px}

  /* articles */
  .articles-list{display:flex;flex-direction:column;gap:14px}
  .article-card{display:flex;align-items:center;gap:22px;background:var(--cream);border:1px solid var(--line);border-radius:var(--radius);padding:24px 28px;transition:transform .2s,border-color .2s,box-shadow .2s}
  .article-card:hover{border-color:var(--teal);transform:translateX(5px);box-shadow:var(--shadow-soft)}
  html[dir="rtl"] .article-card:hover{transform:translateX(-5px)}
  .article-date{font-size:12.5px;font-weight:700;color:var(--saffron);white-space:nowrap;flex-shrink:0;min-width:88px}
  .article-card h3{font-size:1.15rem;margin-bottom:5px}
  .article-card p{font-size:14.5px;color:var(--muted)}
  .article-card .arrow{margin-inline-start:auto;color:var(--teal);font-weight:800;font-size:20px;flex-shrink:0;transition:transform .2s}
  html[dir="rtl"] .article-card .arrow{transform:scaleX(-1)}
  @media(max-width:600px){.article-card{flex-direction:column;align-items:flex-start;gap:8px}.article-card .arrow{display:none}}

  /* contact */
  .band-deep .head h2,.band-deep h2{color:#F4F8F6}
  .contact-intro{color:#B7CEC9;font-size:1.05rem;max-width:34em;margin-bottom:30px}
  form{display:grid;gap:16px;max-width:540px}
  .field{display:grid;gap:7px}
  form label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7FA8A2;font-weight:700}
  html[dir="rtl"] form label{letter-spacing:0;text-transform:none}
  input,textarea{font-family:inherit;font-size:15px;color:#F2F6F5;width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:13px 15px;transition:border-color .15s,background .15s}
  input::placeholder,textarea::placeholder{color:#6E938D}
  input:focus,textarea:focus{outline:none;border-color:var(--teal-bright);background:rgba(255,255,255,.1)}
  textarea{resize:vertical;min-height:124px}
  .form-submit{justify-self:start;cursor:pointer;border:none;font-family:var(--sans);font-weight:800;font-size:15px;background:var(--saffron);color:#3a2a05;padding:15px 32px;border-radius:999px;transition:background .15s,transform .15s}
  html[dir="rtl"] .form-submit{justify-self:end;font-family:var(--fa)}
  .form-submit:hover{background:#eeb53f;transform:translateY(-2px)}
  .form-status{font-size:14.5px;font-weight:700;min-height:1.2em;color:#9ED8CE}
  .form-status.err{color:var(--saffron)}
  .hp{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .note{margin-top:26px;font-size:13.5px;color:#8FAAA4;max-width:46em}

  /* footer */
  footer{border-top:1px solid var(--line);padding:30px 0;font-size:13.5px;color:var(--muted)}

  @media(prefers-reduced-motion:reduce){
    *{animation:none!important}
    .reveal{opacity:1;transform:none;transition:none}
    html{scroll-behavior:auto}
  }
</style>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--paper:#FFFFFF;--sand:#F4F4F3;--line:#E6E6E3;--line-soft:#EEEEEC;--muted:#6B6B68;--teal:#1C1C1B;--teal-bright:#333331;--deep:#1A1A19;--deep2:#111110;--teal-soft:#F0F0EE;--ink:#1A1A19;--saffron:#A98F57;--saffron-soft:#EEE6D2;}
body{background:#FFFFFF}
header{background:rgba(255,255,255,.85)}

html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{font-family:'Vazirmatn',sans-serif;font-weight:700;letter-spacing:0}
.hero h1{font-size:clamp(2.6rem,5.6vw,4.1rem);line-height:1.06}
.wordmark{font-family:'Space Grotesk',sans-serif;font-weight:700}
html[dir="rtl"] .wordmark{font-family:'Vazirmatn',sans-serif}
.eyebrow,.kicker{color:#9E854E;letter-spacing:.2em}

.seal-num{font-family:'Space Grotesk',sans-serif;font-weight:600}
.arc{letter-spacing:2.4px}
.sig .nm{font-family:'Space Grotesk',sans-serif;font-style:normal;font-weight:600}
</style>
</head>

<main>

              <path id="sealArc" d="M120,120 m-95,0 a95,95 0 1,1 190,0 a95,95 0 1,1 -190,0"/>

            <circle class="ring-o" cx="120" cy="120" r="112"/>
            <circle class="disc" cx="120" cy="120" r="103"/>

            <text class="arc"><textPath href="#sealArc" startOffset="2%">QUALITY · INSPECTION · ISO · HSE · TORONTO ·</textPath></text>

<script>
  let lang = new URLSearchParams(location.search).get('lang') === 'fa' ? 'fa' : 'en';
  const btn = document.getElementById('langToggle');
  function render(){
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === 'fa') ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-en]').forEach(el=>{
      el.innerHTML = el.getAttribute('data-' + lang);
    });
    document.querySelectorAll('[data-ph-en]').forEach(el=>{
      el.placeholder = el.getAttribute('data-ph-' + lang);
    });
    btn.textContent = (lang === 'fa') ? 'English' : 'فارسی';
    document.title = (lang === 'fa')
      ? 'عزیز ابنار | مشاوره ایزو ۹۰۰۱ و کیفیت، تورنتو'
      : 'Aziz Abnar | ISO 9001 & Quality Consulting, Toronto';
  }
  btn.addEventListener('click', ()=>{ lang = (lang === 'en') ? 'fa' : 'en'; render(); });
  render();

  // contact form -> Formspree (email stays hidden in the form action / dashboard)
  const form = document.getElementById('contactForm');
  const formStatus = document.getElementById('formStatus');
  const STATUS = {
    sending: { en: 'Sending…', fa: 'در حال ارسال…' },
    ok: { en: 'Thank you. Your message has been sent.', fa: 'سپاسگزارم. پیام شما ارسال شد.' },
    err: { en: 'Something went wrong. Please email directly or try again.', fa: 'مشکلی پیش آمد. لطفاً مستقیم ایمیل بزنید یا دوباره تلاش کنید.' }
  };
  if (form) {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      formStatus.className = 'form-status';
      formStatus.textContent = STATUS.sending[lang];
      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });
        if (res.ok) {
          form.reset();
          formStatus.className = 'form-status';
          formStatus.textContent = STATUS.ok[lang];
        } else {
          formStatus.className = 'form-status err';
          formStatus.textContent = STATUS.err[lang];
        }
      } catch (err) {
        formStatus.className = 'form-status err';
        formStatus.textContent = STATUS.err[lang];
      }
    });
  }

  // scroll reveal
  const io = new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} });
  },{threshold:.12});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
